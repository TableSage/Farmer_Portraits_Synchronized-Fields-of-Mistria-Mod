<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farmer Portraits - Preset Builder</title>
<style>
/* One hue family (rose-plum, ~335) stepped by lightness, plus three status
   colours dark enough to read as text on any surface here. Borders are all
   hairlines: --line inside a panel, --edge for the panel itself. */
:root{
  --page:#231d28; --on-page:#e8dae2;
  --panel:#fbf1f5; --panel-2:#f4e5ec; --tile:#efe6ee; --sel:#e7d8e4;
  --line:#d9c6d2; --edge:#2f2630;
  --ink:#3d2f3a; --dim:#7a6874;
  --ok:#2f7350; --bad:#a83a3a; --warn:#8a5a12;
}
*{box-sizing:border-box}
body{margin:0;padding:24px 20px 56px;background:var(--page);color:var(--ink);
  font:400 15px/1.5 system-ui,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
/* Sized to hug the 4-wide grid rather than fill the window. */
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#cards{display:flex;flex-direction:column;gap:12px}

.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  padding:18px 20px}
/* Editor cards sit beneath the top card: same border, one step darker, so they
   read as nested without a second frame competing for attention. */
.card{background:var(--panel-2);position:relative;padding:16px 20px}

/* Tile and tag list side by side. Under the tile the tags wrapped and threw the
   rows out of line; beside it the list scrolls at the tile's own height. */
/* minmax(0,1fr) and min-width:0 both matter: a grid column sizes to its content
   by default, so one long unbreakable tag would widen slot 1 and squeeze the
   rest of the row instead of clipping. */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cell{display:flex;gap:10px;padding:6px;border-radius:8px;cursor:pointer;
  min-width:0;border:1px solid transparent}
.cell.sel{background:var(--sel);border-color:var(--edge)}
.cell.drop{background:#e6f1e9;border-color:var(--ok)}
.tile{position:relative;flex:none;width:98px;height:174px;background:var(--tile);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.cell.sel .tile{border-color:var(--edge)}
.tile img{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}
/* The number sits over artwork, so it needs its own opaque chip. */
.tile .num{position:absolute;top:0;left:0;padding:0 6px;z-index:2;
  font-size:12px;font-weight:600;color:var(--dim);background:#fff;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  border-bottom-right-radius:4px}
.tile .count{position:absolute;bottom:4px;right:4px;padding:1px 7px;z-index:2;
  font-size:12px;font-weight:600;color:#fff;background:var(--ok);border-radius:9px}
.tile .empty{font-size:13px;color:var(--dim)}
/* Tags are identifiers that end up in filenames, so they stay monospace while
   the messages beside them are sans - the contrast is doing hierarchy work.
   One line each, clipped: the whole tag is readable in the editor below, and
   wrapping here is what threw the rows out of line in the first place. */
.cap{flex:1;min-width:0;height:174px;overflow-y:auto;font-size:12px;line-height:1.6}
.cap b,.cap i,.cap s{display:block;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap b{color:var(--ok);font-family:ui-monospace,Consolas,"Courier New",monospace}
.cap b.dead{color:var(--warn);text-decoration:line-through}
.cap i{color:var(--bad);font-style:normal}
.cap s{color:var(--dim);text-decoration:none;font-weight:400}

/* The two headings on the dark page, same treatment at two sizes. Title case
   with the tracking pulled back in: letterspacing is a fix for capitals, and at
   these sizes normal words want slightly less than default, not more. They both
   grow a step to hold the same weight on the page that the capitals did. */
.pageHead,.slotHead{font-weight:600;letter-spacing:-.01em;color:var(--on-page)}
.pageHead{margin:0 0 -2px;font-size:27px}
.slotHead{margin:6px 0 -4px;font-size:20px}
/* Preview, then the trigger in two columns, then tag and warnings on the right
   where they can be scanned down a stack of cards. */
.detail{display:grid;grid-template-columns:142px 1fr 232px;gap:22px;
  align-items:start}
/* Checkerboard, so a background the user forgot to remove in Picrew is obvious
   here rather than in game. The art fills the box edge to edge, and the box is
   the same size empty or filled so an upload doesn't shift the row. */
.preview{width:142px;height:252px;border:1px dashed var(--line);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;background-color:#f7f2f7;background-size:14px 14px;
  background-position:0 0,7px 7px;
  background-image:
    linear-gradient(45deg,#e0d5e2 25%,transparent 25%,transparent 75%,#e0d5e2 75%),
    linear-gradient(45deg,#e0d5e2 25%,transparent 25%,transparent 75%,#e0d5e2 75%)}
.preview.filled{border-style:solid}
.preview img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  display:block}
.preview .arrow{font-size:30px;line-height:1;color:var(--dim)}
.preview .lbl{margin-top:4px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field{display:flex;flex-direction:column;gap:4px}
/* One small-caps label style for every label on the card. */
.field label,.preview .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
/* Held a size below the body text: the dropdowns are the widest thing on the
   card and the tag column beside them is worth more than their bulk. */
select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--ink);width:100%}
select:disabled{background:#ece2e8;color:var(--dim)}
.chk{grid-column:1 / -1;display:flex;gap:8px;align-items:center;
  font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:#b06489}
/* Right padding keeps the tag clear of the delete button in the corner. */
.meta{display:flex;flex-direction:column;gap:6px;padding-right:26px}
.tagline code{display:block;padding:5px 8px;border:1px solid var(--ok);
  border-radius:5px;color:var(--ok);font-size:13px;overflow-wrap:anywhere}
.tagline .bad{color:var(--bad);font-size:13px;font-weight:600}
/* A tag that is valid but unreachable: it exports, it just never shows up. */
.tagline code.dead{border-color:var(--warn);color:var(--warn)}
.tagline .warn{display:block;margin-top:4px;color:var(--warn);font-size:12px}
.filename{font-size:12px;color:var(--dim);overflow-wrap:anywhere}

/* Flex-centred rather than line-height-centred, then nudged: the multiplication
   sign's ink sits low in its line box, so centring the box leaves the glyph
   about 2px below the middle of the button. The padding lifts it back. */
.del{position:absolute;top:10px;right:12px;width:26px;height:26px;
  padding:0 0 4px 1px;display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;border-radius:5px;border:1px solid var(--line);
  background:#fff;color:var(--dim);cursor:pointer}
.del:hover{background:#fbeded;border-color:var(--bad);color:var(--bad)}

/* Destructive on the left, the good one on the right and three times as wide.
   Same type and shape for both so the pair reads as one control; only colour
   separates them. Status spans the full width underneath. */
.foot{margin-top:14px;display:grid;grid-template-columns:1fr 3fr;gap:10px}
.foot button{width:100%}
button{font:inherit;font-size:15px;font-weight:600;padding:10px 18px;
  border:1px solid var(--line);border-radius:6px;background:#fff;
  color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:#f6ecf1}
button:disabled{opacity:.45;cursor:not-allowed}
#export{background:#dcefe1;border-color:#4f8f63;color:#24583a}
#export:hover:not(:disabled){background:#cbe7d3}
#reset{background:#eae0d3;border-color:#a08a70;color:#5a4632}
#reset:hover:not(:disabled){background:#e0d3c1}
button.add{width:100%;background:transparent;border-style:dashed;
  border-color:#584655;color:var(--on-page)}
button.add:hover:not(:disabled){background:#2e2733}
/* One problem per line, straight under the grid they refer to. Joined with
   separators they ran to three wrapped lines and none were scannable. */
#status{display:block;font-size:14px;font-weight:500;margin-top:14px}
#status .line{padding:1px 0}
#status .bad{color:var(--bad)} #status .ok{color:var(--ok)}
#status .warn{color:var(--warn)}
.note{font-size:13px;color:var(--dim);margin:12px 0 0;line-height:1.6}
.note b{color:var(--ink);font-weight:600}
/* The next-steps note after an export: same place as the warnings it replaces,
   boxed so it reads as a result rather than another line of status. */
.note.box{border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  background:#fffafc;color:var(--ink)}
.gridfoot{display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px;flex-wrap:wrap}
.gridfoot .note{margin-bottom:0}
.toggles{display:flex;gap:18px;flex-wrap:wrap}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;
  color:var(--ink);white-space:nowrap;cursor:pointer;user-select:none}
.toggle input{width:17px;height:17px;accent-color:#c06a92;cursor:pointer}
/* Display-only. The export mirrors unconditionally - this just previews it, so
   it must never be read back when building. */
#wrap.flipped .tile img, #wrap.flipped .preview img{transform:scaleX(-1)}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <h1 class="pageHead">Farmer Portrait Binding Tool</h1>

  <!-- Tiles, then what is wrong with them, then the controls: nothing between
       the grid and its own warnings. -->
  <div class="panel">
    <div class="grid" id="grid"></div>
    <span id="status"></span>
    <p class="note box" id="afterExport" style="display:none"></p>
    <div class="gridfoot">
      <p class="note"><b>Slot number = in-game preset slot.</b></p>
      <div class="toggles">
        <label class="toggle" title="The export always mirrors. This only changes what you see here.">
          <input type="checkbox" id="flip"> Preview flipped images</label>
        <label class="toggle" title="Adds every cutscene and the late-game and secret locations to the dropdowns. Names only, but they give away story beats.">
          <input type="checkbox" id="spoilers"> Include spoiler options</label>
      </div>
    </div>
    <div class="foot">
      <button id="reset"
        title="Your work is saved in this browser. This throws it away.">Start over</button>
      <button id="export">Finish and export</button>
    </div>
  </div>

  <h2 class="slotHead" id="slotHead">Slot 1</h2>
  <div id="cards"></div>
  <button class="add" id="addCard">+ Add another portrait to this slot</button>

</div>
<input type="file" id="picker" accept="image/png,.png" multiple style="display:none">
<script>
"use strict";

/* ------------------------------------------------------------------ data
   Vocabulary and the precedence list are transcribed from the mod. PATTERNS
   must stay identical to deulo_farmer_portraits_keys() in FarmerPortraits.gml;
   `node test_tool.mjs` diffs the two and is the thing to run after any edit
   here. An off-list tag is never looked up in game and fails silently, which is
   undebuggable without that check.                                           */

const SEASONS = ['spring','summer','fall','winter'];
const WEATHER = ['sunny','rain','thunder','special'];
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

const LOCATIONS = `abandoned_mines abandoned_pit adelines_bedroom adelines_office aldaria
balors_room bathhouse bathhouse_bath bathhouse_bedroom bathhouse_change_room beach
beach_secret blacksmith_room_left blacksmith_room_right blacksmith_store caldarus_house
celines_room clinic_b1 clinic_f1 clinic_f2 deep_woods dells_bedroom dragonsworn_glade
dungeon earth_seal eastern_road eilands_bedroom eilands_office elsies_bedroom
errols_bedroom farm fire_seal general_store_home general_store_store haydens_bedroom
haydens_farm haydens_house holt_and_noras_bedroom inn jo_and_hemlocks_room
landens_house_f1 landens_house_f2 large_barn large_coop large_greenhouse lucs_room
manor_house_dining_room manor_house_entry maples_room medium_barn medium_coop mill
mines_entry museum_entry narrows narrows_secret player_home player_home_east
player_home_north player_home_upper_central player_home_upper_east
player_home_upper_west player_home_west priestess_quarters reinas_room ruins_seal
seridias_chamber seridias_house seridias_house_back small_barn small_coop
small_greenhouse summit terithias_house town void_seal water_seal
western_ruins`.split(/\s+/);

const CUTSCENES = `adeline_eight_hearts adeline_four_hearts adeline_quest_board
adeline_six_hearts adeline_ten_hearts adeline_two_hearts
animal_festival_upcoming_eligible_year_one
animal_festival_upcoming_eligible_year_two
animal_festival_upcoming_ineligible_year_one
animal_festival_upcoming_ineligible_year_two apiaries_and_terrariums arena
arena_end balor_eight_hearts balor_four_hearts balor_six_hearts
balor_ten_hearts balor_two_hearts bathhouse bathhouse_date beach_date
beach_secret big_chicken break_earth_seal break_fire_seal
break_ruins_seal_pt_1 break_ruins_seal_pt_2 break_ruins_seal_pt_3
break_water_seal caldarus_eight_hearts caldarus_recovery caldarus_ten_hearts
celine_eight_hearts celine_four_hearts celine_six_hearts celine_ten_hearts
celine_two_hearts cop_some_ore crafting crafting_tutorial cutscene_basement
day_zero deep_woods_picnic_date delivering_the_sealing_scroll
destroy_vines_eastern_road do_a_bro_a_favor dragon_tablet_pt_1
dragon_tablet_pt_2 dragon_tablet_pt_3 dragon_tablet_pt_4 dying earth_seal
eiland_eight_hearts eiland_four_hearts eiland_six_hearts eiland_ten_hearts
eiland_two_hearts elsie_dating_tutorial engagement_tutorial farm_introduction
find_the_weathervane find_the_weathervane_setup fire_seal full_restore
gem_cutting_date great_bird_0 great_bird_1 harvest_festival_dance
harvest_festival_first_place harvest_festival_morning
harvest_festival_no_place harvest_festival_second_place harvest_festival_setup
harvest_festival_third_place hayden_eight_hearts hayden_four_hearts
hayden_six_hearts hayden_ten_hearts hayden_two_hearts inn_meal_date
jos_cooking_class juniper_eight_hearts juniper_four_hearts juniper_six_hearts
juniper_ten_hearts juniper_two_hearts lost_and_found march_eight_hearts
march_four_hearts march_six_hearts march_ten_hearts march_two_hearts
mistril_rank museum_donation_wanted narrows_secret park_date pet_arrival
pet_dream player_delivery post_earth_seal post_water_seal
priestess_quarters_pt_1 priestess_quarters_pt_2 procuring_the_sealing_scroll
prologue reina_eight_hearts reina_four_hearts reina_six_hearts
reina_ten_hearts reina_two_hearts repair_haydens_barn_pt_1
repair_haydens_barn_pt_2 repair_the_beach_bridge_pt_1
repair_the_beach_bridge_pt_2 repair_the_bell_tower_pt_1
repair_the_bell_tower_pt_2 repair_the_bridge_pt_1 repair_the_bridge_pt_2
repair_the_general_store_pt_1 repair_the_general_store_pt_2
repair_the_inn_pt_1 repair_the_inn_pt_2 repair_the_mill_pt_1
repair_the_mill_pt_2 repair_the_summit_stairs
replenishing_mistrias_food_reserves_1
replenishing_mistrias_food_reserves_2_pt_1
replenishing_mistrias_food_reserves_2_pt_2 reveal_mistmare ryis_eight_hearts
ryis_four_hearts ryis_six_hearts ryis_ten_hearts ryis_two_hearts
seridia_eight_hearts seridia_ten_hearts shooting_star_adeline
shooting_star_balor shooting_star_blocked shooting_star_caldarus
shooting_star_celine shooting_star_eiland shooting_star_hayden
shooting_star_juniper shooting_star_march shooting_star_morning
shooting_star_reina shooting_star_romantic shooting_star_ryis
shooting_star_seridia shooting_star_solo shooting_star_valen sleep
somethings_bugging_me spouse_delivery spring_festival_first_place
spring_festival_first_place_plus spring_festival_morning
spring_festival_no_place spring_festival_second_place spring_festival_setup
spring_festival_setup_year_2 spring_festival_third_place stinky_stamina_potion
stone_refinery_pt_1 stone_refinery_pt_2 stork_delivery tea_with_hayden
the_animal_festival the_unusual_tree_pt_1 the_unusual_tree_pt_2
translating_the_earth_tablet translating_the_fire_tablet
translating_the_water_tablet unlocking_the_mines_pt_1 unlocking_the_mines_pt_2
upgrade_the_carpenters_shop_pt_1 upgrade_the_carpenters_shop_pt_2
upgrade_the_saturday_market upgrade_the_saturday_market_plaza
valen_eight_hearts valen_four_hearts valen_six_hearts valen_ten_hearts
valen_two_hearts water_seal wedding`.split(/\s+/);

const PATTERNS = [
  'season_weather_cutscene','season_cutscene','weather_cutscene','cutscene',
  'season_weather_location','season_weather_inout','season_weather_day',
  'season_weather','season_location','season_inout','season_daynumber',
  'season_day','season','weather_location','weather','day','location',
  'inout','default',
];

const KINDS = [['','(nothing more)'],['day','Weekday'],['daynumber','Day of month'],
  ['location','Location'],['inout','Indoor / outdoor'],['cutscene','Cutscene']];

const VALUES = {
  day: DAYS, location: LOCATIONS, cutscene: CUTSCENES,
  inout: ['indoor','outdoor'],
  daynumber: Array.from({length:28},(_,i)=>String(i+1)),
};

/* ------------------------------------------------------------------ spoilers
   DeUlo lists both vocabularies behind spoiler tags: the locations as "some
   late-game / secret spots", the cutscenes as heavy story spoilers including
   the mines quest. Every cutscene name is therefore hidden by default, and the
   locations are split - the everyday map stays available, because a tool where
   you cannot pick `farm` without opting into spoilers is a worse tool.

   The lists themselves are never filtered, only what the dropdowns offer: a tag
   already chosen stays valid and keeps working, and the dead-trigger maths
   still counts all 78 locations whether or not they are on screen. */
const SPOILER_LOCATIONS = new Set(`abandoned_mines abandoned_pit aldaria
beach_secret caldarus_house dragonsworn_glade dungeon earth_seal fire_seal
narrows_secret priestess_quarters ruins_seal seridias_chamber seridias_house
seridias_house_back terithias_house void_seal water_seal
western_ruins`.split(/\s+/));

let spoilers = false;

// The blank row doubles as the explanation when the toggle is what emptied the
// list. Picking Cutscene with spoilers off otherwise just looks broken.
function hintFor(kind, opts){
  if (!VALUES[kind] || !opts) return 'select...';
  const hidden = VALUES[kind].length - opts.length;
  if (!hidden) return 'select...';
  return opts.length ? `select... (${hidden} more with spoilers)`
                     : 'enable spoiler options to see';
}

// What the Value dropdown offers for a kind. The card's own value is always
// included even when it is a spoiler, so unticking the box can never silently
// drop a trigger someone already built.
function valuesFor(kind, keep){
  const all = VALUES[kind];
  if (!all || spoilers) return all;
  if (kind === 'cutscene') return all.filter(v => v === keep);
  if (kind === 'location')
    return all.filter(v => !SPOILER_LOCATIONS.has(v) || v === keep);
  return all;
}

const SLOTS = 8;                       // hard constraint: the game has 8 presets
const TARGET_H = 180;                  // DEULO_FP_VANILLA_PORTRAIT_H -> fit 1.0
// The export is exactly one mod folder, already named the way it has to land, so
// the whole install is "unzip, drag the folder in". The outfit mod is NOT built
// here - it ships fixed beside this file and is installed once. Only the table
// it reads is generated, and that travels with the artwork it describes.
const MOD_DIR = 'FarmerPortraitsExample';

/* ----------------------------------------------------------------- state
   A slot is a list of portraits, not one portrait. Several tags can point at
   the same in-game outfit - "my winter coat covers all four winter weathers" -
   so the tag is what varies and the slot number is what they share. */

/* url is the *downsampled* PNG as a data URL - see toNative(). Uploads are
   reduced to native pixels the moment they land, so the preview, the export and
   the saved copy are all the same handful of kilobytes, and nothing has to hold
   on to a 540x960 File. */
const blank = () => ({name:'', url:'', img:null,
  isDefault:false, season:'', weather:'', kind:'', value:''});
const slots = Array.from({length:SLOTS}, () => ({cards:[blank()]}));
let current = 0;
// Shown on the status line until the next file lands. Rejections have to say
// something: a dropped .jpg that vanishes silently reads as a broken tool.
let notice = '';

const everyCard = () =>
  slots.flatMap((s, slot) => s.cards.map((card, idx) => ({card, slot, idx})));

/* ------------------------------------------------------------- persistence
   Building eight portraits is half an hour of work; losing it to a stray reload
   is not acceptable. Saving is possible at all only because uploads are stored
   downsampled - a 90x160 PNG is a few KB, where the Picrew original is tens of
   KB and eight of them would not fit in localStorage. */

const STORE = 'farmerPortraitsSync.v1';
let restoring = false;
let saveNote = '';

function saveState(){
  if (restoring) return;
  try {
    localStorage.setItem(STORE, JSON.stringify({v:1, current, spoilers,
      slots: slots.map(s => ({cards: s.cards.map(c => ({
        name:c.name, url:c.url, isDefault:c.isDefault, season:c.season,
        weather:c.weather, kind:c.kind, value:c.value,
      }))}))}));
    saveNote = '';
  } catch (err){
    // Quota, private browsing, a locked-down browser - all the same to the user.
    saveNote = 'browser storage is unavailable, your work is not being saved';
  }
}

function restoreState(){
  let raw = null;
  try { raw = localStorage.getItem(STORE); } catch (err){ return; }
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch (err){ return; }
  // Anything unrecognised is dropped rather than half-applied: a broken restore
  // that silently loses one card is worse than starting clean.
  if (!data || data.v !== 1 || !Array.isArray(data.slots)) return;
  restoring = true;
  data.slots.slice(0, SLOTS).forEach((s, i) => {
    if (!s || !Array.isArray(s.cards) || !s.cards.length) return;
    slots[i].cards = s.cards.map(c => Object.assign(blank(), {
      name: String(c.name || ''), url: typeof c.url === 'string' ? c.url : '',
      isDefault: !!c.isDefault,
      season: SEASONS.includes(c.season) ? c.season : '',
      weather: WEATHER.includes(c.weather) ? c.weather : '',
      kind: KINDS.some(k => k[0] === c.kind) ? c.kind : '',
      value: String(c.value || ''),
    }));
  });
  if (Number.isInteger(data.current) && data.current >= 0 && data.current < SLOTS)
    current = data.current;
  // Remembered so nobody has to opt in twice, but never inferred from the board:
  // restoring a build that uses a cutscene does not turn the names back on.
  spoilers = !!data.spoilers;
  $('spoilers').checked = spoilers;
  restoring = false;
  // Decoding is async, so a card is "still loading" for a frame or two. Export
  // is gated on card.img, not card.url, so it cannot race ahead of this.
  everyCard().forEach(({card}) => { if (card.url) attach(card); });
}

/* --------------------------------------------------------------- tag logic
   Ported verbatim from make_mapping.py, which is validated and in use. */

function shapeOf(c){
  if (c.isDefault) return (c.season || c.weather || c.kind) ? 'x' : 'default';
  const parts = [];
  if (c.season) parts.push('season');
  if (c.weather) parts.push('weather');
  if (c.kind) parts.push(c.kind);
  return parts.join('_');
}
function tagOf(c){
  if (c.isDefault) return 'default';
  return [c.season, c.weather, c.kind ? c.value : ''].filter(Boolean).join('_');
}
function statusOf(c){
  if (!c.isDefault && !c.season && !c.weather && !c.kind)
    return {state:'empty', msg:'no trigger set'};
  if (c.kind && VALUES[c.kind] && !c.value)
    return {state:'bad', msg:'pick a value'};
  if (!PATTERNS.includes(shapeOf(c)))
    return {state:'bad', msg:'not a valid combination'};
  return {state:'ok', tag:tagOf(c)};
}

/* ----------------------------------------------------------- dead triggers
   The mod walks the keys in PATTERNS order and takes the first one that has a
   sprite, so a trigger is only reached where nothing above it matched. In
   DeUlo's list every shape outranks the shapes it extends, so no single trigger
   can hide another - deadness always comes from a SET. winter_indoor and
   winter_outdoor between them leave no winter context over, and a plain
   `winter` card is then art that can never appear in game.

   Context dimensions are treated as independent, which they are not - the beach
   is always outdoor, day 8 is always the same weekday. That only ever invents
   contexts the game cannot produce, and a cover holding over the larger set
   holds over the real one, so this can miss a dead trigger but not invent one. */

// How many values each dimension can take. cutscene gets one more than the list
// because "no cutscene" is the usual case and is a context like any other.
const DIMS = {season:SEASONS.length, weather:WEATHER.length, day:DAYS.length,
  daynumber:28, location:LOCATIONS.length, inout:2, cutscene:CUTSCENES.length+1};

// A card as the context values it demands; anything unlisted it does not care
// about. Same fields as the tag, which is why kind doubles as the dimension.
function regionOf(c){
  const r = {};
  if (c.isDefault) return r;
  if (c.season) r.season = c.season;
  if (c.weather) r.weather = c.weather;
  if (c.kind) r[c.kind] = c.value;
  return r;
}

// Stands in for every value nobody named. Spaces and brackets are not legal in
// any tag, so it can never collide with a real one.
const OTHER = '(any other)';

// Is every context inside `target` claimed by one of `regions`?
function covered(target, regions){
  const free = {};
  for (const r of regions) for (const d in r)
    if (!(d in target)) (free[d] = free[d] || new Set()).add(r[d]);
  const dims = Object.keys(free);
  // One stand-in for every value nobody named. A rival has to name a value to
  // match it, so an unnamed value is a context still going spare - which is why
  // naming three of eighty locations covers nothing.
  const doms = dims.map(d => {
    const vals = [...free[d]];
    return vals.length < DIMS[d] ? vals.concat([OTHER]) : vals;
  });
  const total = doms.reduce((n, d) => n * d.length, 1);
  if (total > 20000) return false;   // absurd board; say nothing rather than hang
  for (let n = 0; n < total; n++){
    const ctx = Object.assign({}, target);
    let k = n;
    dims.forEach((d, i) => {
      ctx[d] = doms[i][k % doms[i].length];
      k = (k / doms[i].length) | 0;
    });
    if (!regions.some(r => Object.keys(r).every(d => r[d] === ctx[d]))) return false;
  }
  return true;
}

// card -> {slot, by} for every card the rest of the build leaves nothing to do.
function shadowed(){
  const cards = everyCard()
    .filter(x => statusOf(x.card).state === 'ok')
    .map(x => Object.assign({rank: PATTERNS.indexOf(shapeOf(x.card)),
                             region: regionOf(x.card)}, x));
  const out = new Map();
  for (const b of cards){
    // Only cards that outrank this one, and only where they agree with it: a
    // rival naming a different season is looking at another day entirely.
    let rivals = cards.filter(a => a.rank < b.rank && Object.keys(b.region)
      .every(d => !(d in a.region) || a.region[d] === b.region[d]));
    if (!rivals.length || !covered(b.region, rivals.map(r => r.region))) continue;
    // Name the tags that actually did it, not everything ranked above it.
    for (const r of rivals.slice()){
      const less = rivals.filter(x => x !== r);
      if (less.length && covered(b.region, less.map(x => x.region))) rivals = less;
    }
    out.set(b.card, {slot: b.slot, by: rivals.map(r => tagOf(r.card))});
  }
  return out;
}

// Recomputed once per paint rather than per card: cheap, but it reads the whole
// board, and both the grid and the editor cards need the same answer.
let dead = new Map();

/* ------------------------------------------------------------------- dom */

const $ = id => document.getElementById(id);
// Everything else written into a status line comes from a fixed vocabulary, but
// filenames come from the user's disk and are reported verbatim, so they get
// escaped: a PNG named after an <img onerror=...> would otherwise run it.
const esc = s => String(s).replace(/[&<>]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function fill(select, opts, blankLabel){
  select.innerHTML = '';
  if (blankLabel !== null) select.append(new Option(blankLabel, ''));
  for (const o of opts){
    const [v,l] = Array.isArray(o) ? o : [o, o.replace(/_/g,' ')];
    select.append(new Option(l, v));
  }
}

/* -------------------------------------------------------------- the grid */

const grid = $('grid');
const cells = [];
for (let i = 0; i < SLOTS; i++){
  const cell = el('div', 'cell',
    `<div class="tile"><span class="num">${i+1}</span>`
    + `<span class="empty">empty</span></div><div class="cap"></div>`);
  cell.onclick = () => select(i);
  grid.append(cell);
  cells.push(cell);
}

function select(i){
  current = i;
  buildCards();
  render();
}

/* ------------------------------------------------------- the editor cards
   Rebuilt only when the selection or the card count changes. Editing a
   dropdown updates state and re-renders the grid, but leaves these elements
   alone, so nothing steals focus mid-edit. */

function buildCards(){
  const host = $('cards');
  dead = shadowed();
  host.innerHTML = '';
  $('slotHead').textContent = `Slot ${current+1}`;
  slots[current].cards.forEach((card, idx) => host.append(makeCard(card, idx)));
}

function makeCard(card, idx){
  const box = el('div', 'panel card');
  const detail = el('div', 'detail');
  const preview = el('div', 'preview');
  const fields = el('div', 'fields');

  // Only offer removal while a spare exists; a slot with no portrait at all
  // would export a tag pointing at nothing.
  if (slots[current].cards.length > 1){
    const del = el('button', 'del', '&times;');
    del.title = 'Remove this portrait';
    del.onclick = e => { e.stopPropagation(); removeCard(idx); };
    box.append(del);
  }

  const chk = el('label', 'chk');
  const isDefault = document.createElement('input');
  isDefault.type = 'checkbox';
  chk.title = 'Shown whenever nothing more specific matches. One per build.';
  chk.append(isDefault, el('span', '', 'Use as default'));
  fields.append(chk);

  const mk = (labelText, opts, blankLabel) => {
    const row = el('div', 'field');
    const lab = el('label', '', labelText);
    const sel = document.createElement('select');
    fill(sel, opts, blankLabel);
    row.append(lab, sel);
    fields.append(row);
    return sel;
  };
  // Two columns, reading across: season then weather, then the extra condition
  // and its value under them.
  const fSeason  = mk('Season', SEASONS, 'any season');
  const fWeather = mk('Weather', WEATHER, 'any weather');
  const fKind    = mk('Then one of', KINDS, null);
  const fValue   = mk('Value', [], 'select...');

  const tagline  = el('div', 'tagline');
  const filename = el('div', 'filename');
  const meta     = el('div', 'meta');
  meta.append(tagline, filename);

  detail.append(preview, fields, meta);
  box.append(detail);

  function readBack(){
    card.isDefault = isDefault.checked;
    card.season  = fSeason.value;
    card.weather = fWeather.value;
    card.kind    = fKind.value;
    card.value   = fValue.value;
    // The mod matches exactly one default across the whole build, so ticking
    // this box has to clear it everywhere else, not just in this slot.
    if (card.isDefault){
      card.season = card.weather = card.kind = card.value = '';
      everyCard().forEach(x => { if (x.card !== card) x.card.isDefault = false; });
    }
  }
  function paint(){
    isDefault.checked = card.isDefault;
    fSeason.value  = card.season;
    fWeather.value = card.weather;
    // Both dropdowns are rebuilt here rather than once at creation, because the
    // spoiler toggle changes what they may offer. A kind or value the card is
    // already using is kept whatever the toggle says.
    // Cutscene stays on the list even with spoilers off - the word is not the
    // spoiler, the names are, and hiding the whole condition reads as the tool
    // being broken rather than as a choice the user can make.
    fill(fKind, KINDS, null);
    fKind.value    = card.kind;
    const opts = valuesFor(card.kind, card.value);
    fill(fValue, opts || [], hintFor(card.kind, opts));
    fValue.value = opts ? card.value : '';
    fSeason.disabled = fWeather.disabled = fKind.disabled = card.isDefault;
    fValue.disabled = card.isDefault || !opts;

    preview.className = 'preview' + (card.url ? ' filled' : '');
    preview.innerHTML = card.url ? `<img src="${card.url}" alt="">`
      : '<div class="arrow">&#11014;</div><div class="lbl">UPLOAD</div>';
    filename.textContent = card.name;
    const st = statusOf(card);
    const d = dead.get(card);
    tagline.innerHTML = st.state !== 'ok'
      ? `<span class="bad">⚠ ${st.msg}</span>`
      : `<code${d ? ' class="dead"' : ''}>${st.tag}</code>`
        + (d ? `<span class="warn">⚠ never appears: ${d.by.join(', ')} `
             + `${d.by.length > 1 ? 'cover' : 'covers'} every context it would</span>` : '');
  }

  [isDefault, fSeason, fWeather, fKind, fValue].forEach(c => {
    c.onchange = () => { readBack(); repaintCards(); render(); };
  });
  preview.onclick = () => { pickTarget = card; $('picker').click(); };

  card._paint = paint;
  // Handles for test_tool.mjs, which drives these the way a user would. The
  // controls live in this closure, so without them the card is untestable.
  card._els = {isDefault, fSeason, fWeather, fKind, fValue,
               preview, tagline, filename};
  paint();
  return box;
}

// Ticking default in one card clears it in the others, so every visible card
// has to be repainted, not just the one that changed.
const repaintCards = () => {
  dead = shadowed();
  slots[current].cards.forEach(c => c._paint && c._paint());
};

$('addCard').onclick = () => {
  slots[current].cards.push(blank());
  buildCards();
  render();
};
function removeCard(idx){
  if (slots[current].cards.length < 2) return;
  slots[current].cards.splice(idx, 1);
  buildCards();
  render();
}

// Purely a viewing aid: Picrew art faces right, the game shows it mirrored.
// Nothing in the build path reads this.
$('flip').onchange = () =>
  $('wrap').classList.toggle('flipped', $('flip').checked);

// Names only, but they are the names of story beats, so this is off until asked
// for and remembered once it is. Nothing downstream reads it: a trigger built
// with the box ticked is an ordinary trigger.
$('spoilers').onchange = () => {
  spoilers = $('spoilers').checked;
  repaintCards();
  render();
};

// Work persists across reloads, so there has to be a way back to empty.
$('reset').onclick = () => {
  if (!confirm('Throw away every portrait and trigger, and start from empty?')) return;
  try { localStorage.removeItem(STORE); } catch (err){ /* nothing to remove */ }
  slots.forEach(s => { s.cards = [blank()]; });
  current = 0;
  notice = '';
  buildCards();
  render();
};

/* ---------------------------------------------------------------- render */

function render(){
  // First, so that a browser refusing to store gets to say so on this pass
  // rather than the next one.
  saveState();
  // Every path here paints the cards first, but this is what the grid and the
  // status lines read, and it is the last thing to run in all of them.
  dead = shadowed();
  slots.forEach((s, i) => {
    const cell = cells[i];
    cell.classList.toggle('sel', i === current);
    const shown = s.cards.find(c => c.url);
    const tile = cell.querySelector('.tile');
    // A slot holding several portraits used to draw stacked sheets behind the
    // front one. The tag list beside the tile says the same thing, so all that
    // is left of it is the count badge.
    const art = shown ? `<img src="${shown.url}" alt="">`
                      : '<span class="empty">empty</span>';
    const body = `<span class="num">${i+1}</span>`
      + (s.cards.length > 1
          ? `<span class="count">${s.cards.length} items</span>` : '')
      + art;
    // Only touch the DOM when it actually changed; rewriting innerHTML on every
    // dropdown change re-creates the <img> and makes the whole grid flicker.
    if (tile.innerHTML !== body) tile.innerHTML = body;
    cell.querySelector('.cap').innerHTML = s.cards.map(c => {
      const st = statusOf(c);
      return st.state === 'ok'  ? `<b${dead.has(c) ? ' class="dead"' : ''}>${st.tag}</b>`
           : st.state === 'bad' ? `<i>${st.msg}</i>`
           :                      `<s>${st.msg}</s>`;
    }).join('');
  });

  const problems = validate();
  // Three tiers, and only the middle one blocks. A rejected stray file or a
  // warning about preset numbering is not a reason to keep the button dead once
  // every portrait is valid.
  const lines = [
    ...[notice, saveNote].filter(Boolean).map(m => `<div class="line warn">⚠ ${m}</div>`),
    ...problems.map(m => `<div class="line bad">⚠ ${m}</div>`),
    ...advisories(dead).map(m => `<div class="line warn">⚠ ${m}</div>`),
  ];
  if (!problems.length)
    lines.push(`<div class="line ok">✓ ${everyCard().length} portraits ready</div>`);
  $('status').innerHTML = lines.join('');
  $('export').disabled = problems.length > 0;
}

// Highest slot number in use, 1-based - the number of outfit presets the player
// has to have built in game for the whole mapping to reach.
function presetsNeeded(){
  const used = everyCard().filter(x => statusOf(x.card).state === 'ok').map(x => x.slot);
  return used.length ? Math.max(...used) + 1 : 1;
}

// Real mistakes that still export cleanly, so they warn rather than block. The
// gap case is the one that bites: a fresh farmer has ONE preset and they are
// created in order, so mapping slot 6 while slot 3 is empty still means building
// a throwaway preset 3 in game before preset 6 exists at all.
// The dead-trigger map is passed in so render() computes it once, but it
// defaults to a fresh one: this has to be answerable from the board alone.
function advisories(d = shadowed()){
  const out = [];
  const used = new Set(everyCard()
    .filter(x => statusOf(x.card).state === 'ok').map(x => x.slot));
  // Nothing valid yet means nothing to advise about; presetsNeeded() floors at
  // 1, so without this an empty board says slot 1 is both unused and needed.
  if (!used.size) return out;
  const need = presetsNeeded();
  const gaps = [];
  for (let i = 0; i < need; i++) if (!used.has(i)) gaps.push(i + 1);
  if (gaps.length) out.push(`slot ${gaps.join(', ')} unused, but slot ${need} is. `
    + `You still have to build ${need} outfit presets in game`);
  // Warns rather than blocks: the export is correct, it just carries a portrait
  // the game will never reach, and half-built boards hit this on the way past.
  for (const [card, x] of d)
    out.push(`slot ${x.slot+1} "${tagOf(card)}" never appears: ${x.by.join(', ')} `
      + `${x.by.length > 1 ? 'cover' : 'covers'} every context it would`);
  return out;
}

function validate(){
  const out = [];
  const all = everyCard();
  const noImage = all.filter(x => !x.card.url).length;
  if (noImage) out.push(`${noImage} portrait(s) need an image`);
  // Restored images decode asynchronously; exporting before that lands would
  // write empty sprites, so the button stays dead for the frame or two it takes.
  const loading = all.filter(x => x.card.url && !x.card.img).length;
  if (loading) out.push(`${loading} portrait(s) still loading`);
  const bad = all.filter(x => statusOf(x.card).state !== 'ok').length;
  if (bad) out.push(`${bad} portrait(s) need a valid trigger`);
  const defs = all.filter(x => x.card.isDefault).length;
  if (defs !== 1) out.push(defs === 0
    ? 'no portrait set as default (one is required)'
    : `${defs} portraits set as default (only one allowed)`);
  // Two cards with the same tag would write the same sprite file twice, and the
  // second slot number would silently win.
  const tags = all.filter(x => statusOf(x.card).state === 'ok').map(x => tagOf(x.card));
  const dupes = [...new Set(tags.filter((t,i) => tags.indexOf(t) !== i))];
  if (dupes.length) out.push('duplicate tags: ' + dupes.join(', '));
  return out;
}

/* ------------------------------------------------------------------ files */

// Decode card.url (always a small PNG data URL) into the Image the export uses.
function attach(card){
  const im = new Image();
  im.onload = () => { card.img = im; repaintCards(); render(); };
  im.onerror = () => {
    Object.assign(card, {url:'', img:null});
    repaintCards(); render();
  };
  im.src = card.url;
}

// Downsample on arrival rather than at export. The card then holds native
// pixels only, which is what makes the state small enough to save - and it
// means a too-tall image is reported the moment it is dropped instead of
// fifteen minutes later when the export fails.
function loadInto(card, file){
  const src = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(src);
    let nat;
    try { nat = toNative(im); }
    catch (err){ notice = `${esc(file.name)}: ${err.message}`; repaintCards(); render(); return; }
    card.name = file.name;
    card.url = nat.canvas.toDataURL('image/png');
    attach(card);
  };
  // Extension alone is a weak check; a renamed file fails to decode here.
  im.onerror = () => {
    URL.revokeObjectURL(src);
    notice = `${esc(file.name)} is not a readable PNG`;
    repaintCards(); render();
  };
  im.src = src;
}

// Dropping several files on one slot fills it and then adds cards for the rest,
// which is the quick path to "one outfit, four weathers".
function acceptInto(slot, files){
  const s = slots[slot];
  files.forEach((f, n) => {
    if (n === 0) loadInto(s.cards[0], f);
    else { const c = blank(); s.cards.push(c); loadInto(c, f); }
  });
  if (files.length > 1 && slot === current) buildCards();
}
function acceptFiles(files, slot){
  const list = [...files].filter(f => /\.png$/i.test(f.name));
  const rejected = files.length - list.length;
  notice = rejected ? `${rejected} file(s) ignored, PNG only` : '';
  if (!list.length){ render(); return; }
  if (slot !== undefined){ acceptInto(slot, list); return; }
  // A drop on the panel background spreads across slots that are still empty.
  let n = 0;
  for (let i = 0; i < SLOTS && n < list.length; i++)
    if (!slots[i].cards[0].url) loadInto(slots[i].cards[0], list[n++]);
}

let pickTarget = null;
$('picker').onchange = e => {
  const f = [...e.target.files].filter(x => /\.png$/i.test(x.name));
  notice = e.target.files.length - f.length
    ? `${e.target.files.length - f.length} file(s) ignored, PNG only` : '';
  if (f.length && pickTarget) loadInto(pickTarget, f[0]);
  e.target.value = '';
  render();
};

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
cells.forEach((cell, i) => {
  cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drop'); });
  cell.addEventListener('dragleave', () => cell.classList.remove('drop'));
  cell.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    cell.classList.remove('drop');
    select(i);
    acceptFiles(e.dataTransfer.files, i);
    render();
  });
});
grid.addEventListener('drop', e => {
  e.preventDefault(); acceptFiles(e.dataTransfer.files); render();
});

/* -------------------------------------------------------- image pipeline
   Ported from build_portrait.py. Every step is an exact pixel operation:
   detect the nearest-neighbour upscale factor, take one pixel per block,
   mirror, and pad. No resampling anywhere, so the result is pixel-perfect. */

function imageDataOf(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.getContext('2d').getImageData(0, 0, c.width, c.height);
}

function nativeScale(d){
  const {width:w, height:h, data:p} = d;
  let best = 1;
  outer:
  for (let n = 2; n <= 16; n++){
    if (w % n || h % n) continue;
    for (let y = 0; y < h; y++){
      const by = y - (y % n);
      for (let x = 0; x < w; x++){
        const i = (y*w + x)*4, j = (by*w + (x - x%n))*4;
        if (p[i]!==p[j] || p[i+1]!==p[j+1] || p[i+2]!==p[j+2] || p[i+3]!==p[j+3])
          continue outer;
      }
    }
    best = n;
  }
  return best;
}

// Step one, run once when a file lands: detect the upscale factor and take one
// pixel per block. Deliberately separate from the mirror-and-pad below, because
// detection must never run twice - a stored native image handed back to
// nativeScale() could in principle be read as an upscale of something smaller.
function toNative(img){
  const d = imageDataOf(img);
  const n = nativeScale(d);
  const nw = d.width / n, nh = d.height / n;
  if (nh > TARGET_H)
    throw new Error(`${nh}px tall at native scale, taller than ${TARGET_H}`);
  const c = document.createElement('canvas');
  c.width = nw; c.height = nh;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(nw, nh);
  for (let y = 0; y < nh; y++){
    for (let x = 0; x < nw; x++){
      const si = ((y*n)*d.width + x*n) * 4, di = (y*nw + x) * 4;
      out.data[di]   = d.data[si];
      out.data[di+1] = d.data[si+1];
      out.data[di+2] = d.data[si+2];
      out.data[di+3] = d.data[si+3];
    }
  }
  ctx.putImageData(out, 0, 0);
  return {canvas:c, data:out, w:nw, h:nh, scale:n};
}

// Step two, run at export: mirror and pad native pixels to the sprite the mod
// wants. Padding goes on TOP - the sprite origin is top-left and the character
// sits flush to the bottom of the Picrew frame, so anchoring the bottom is what
// keeps portraits from jumping.
function finish(d){
  const nw = d.width, nh = d.height;
  if (nh > TARGET_H)
    throw new Error(`image is ${nh}px tall, taller than ${TARGET_H}`);
  let opaque = true;
  const c = document.createElement('canvas');
  c.width = nw; c.height = TARGET_H;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(nw, TARGET_H);
  const pad = TARGET_H - nh;
  for (let y = 0; y < nh; y++){
    for (let x = 0; x < nw; x++){
      const si = (y*nw + (nw-1-x)) * 4;                // mirrored source pixel
      const di = ((y+pad)*nw + x) * 4;
      out.data[di]   = d.data[si];
      out.data[di+1] = d.data[si+1];
      out.data[di+2] = d.data[si+2];
      out.data[di+3] = d.data[si+3];
      if (d.data[si+3] === 0) opaque = false;
    }
  }
  ctx.putImageData(out, 0, 0);
  return {canvas:c, w:nw, h:TARGET_H, opaque};
}

// The two halves back to back, which is the path a raw Picrew export takes.
// Production never calls this - it downsamples on upload and finishes on export
// - but it is the thing worth testing end to end.
function processImage(img){
  const n = toNative(img);
  return Object.assign(finish(n.data), {scale:n.scale});
}

const TOML = (w,h) => `[meta_properties]
asset_kind = "Animation"

[asset_properties]
frame_size = [${w}, ${h}]
frame_len = 1
atlas = "Npc"
`;

/* ------------------------------------------------------------------- zip
   Stored (uncompressed) entries only. A stored zip is just per-file headers
   plus the raw bytes, so this is shorter than pulling in a zip library and
   keeps the tool a single file. PNGs are already compressed anyway. */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new Uint8Array(30 + name.length);
    const v = new DataView(lh.buffer);
    v.setUint32(0, 0x04034b50, true);
    v.setUint16(4, 20, true);                 // version needed
    v.setUint16(8, 0, true);                  // method 0 = stored
    v.setUint16(10, 0, true);                 // time
    v.setUint16(12, 0x21, true);              // date = 1980-01-01
    v.setUint32(14, crc, true);
    v.setUint32(18, size, true);
    v.setUint32(22, size, true);
    v.setUint16(26, name.length, true);
    lh.set(name, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + name.length);
    const w = new DataView(ch.buffer);
    w.setUint32(0, 0x02014b50, true);
    w.setUint16(4, 20, true);                 // version made by
    w.setUint16(6, 20, true);                 // version needed
    w.setUint16(10, 0, true);                 // method 0 = stored
    w.setUint16(12, 0, true);
    w.setUint16(14, 0x21, true);
    w.setUint32(16, crc, true);
    w.setUint32(20, size, true);
    w.setUint32(24, size, true);
    w.setUint16(28, name.length, true);
    w.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  const cdSize = central.reduce((a,c) => a + c.length, 0);
  const eocd = new Uint8Array(22);
  const e = new DataView(eocd.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eocd], {type:'application/zip'});
}

/* ---------------------------------------------------------------- export */

const canvasBytes = canvas => new Promise(res =>
  canvas.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), 'image/png'));

async function buildFiles(){
  const enc = new TextEncoder();
  const dir = `${MOD_DIR}/animations/FarmerPortraits/`;
  const files = [], outfits = {}, warnings = [];
  for (const {card, slot} of everyCard()){
    const tag = tagOf(card);
    // card.img is already native - it was downsampled on upload - so only the
    // mirror-and-pad half runs here.
    const r = finish(imageDataOf(card.img));
    if (r.opaque) warnings.push(`${tag} has no transparency`);
    files.push({name: `${dir}spr_farmer_portrait_${tag}.png`,
                data: await canvasBytes(r.canvas)});
    files.push({name: `${dir}spr_farmer_portrait_${tag}.meta.toml`,
                data: enc.encode(TOML(r.w, r.h))});
    // Many tags can share one slot; that is the point of multiple cards.
    outfits[tag] = slot;
  }
  // The companion mod reads this. Slot indices are 0-based to match
  // ARI.presets.get(n); the comment travels with the file so the GML side
  // has one place to check if that ever turns out to be off by one.
  files.push({name: `${MOD_DIR}/outfit_slots.json`, data: enc.encode(JSON.stringify({
    _comment: '0-based preset index, as passed to obj_ari.change_preset(n)',
    slots: outfits,
  }, null, 2) + '\n')});
  files.push({name: `${MOD_DIR}/manifest.json`, data: enc.encode(MANIFEST)});

  // The same table as GML, which is what the outfit mod actually reads. It ships
  // with the sprites rather than with the outfit mod so that re-exporting art
  // can never leave the two describing different things.
  files.push({name: `${MOD_DIR}/gml/FarmerPortraitsSlots.gml`,
              data: enc.encode(slotsGml(outfits))});
  return {files, warnings};
}

$('export').onclick = async () => {
  if (validate().length) return;
  const st = $('status');
  st.innerHTML = '<div class="line">building...</div>';
  try {
    const {files, warnings} = await buildFiles();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(makeZip(files));
    a.download = `${MOD_DIR}.zip`;
    a.click();

    st.innerHTML = `<div class="line ok">✓ exported ${files.length} files</div>`;
    const after = $('afterExport');
    after.style.display = '';
    after.innerHTML =
      `<b>Next steps</b><br>`
      + `1. Unzip. You get one folder, <b>${MOD_DIR}</b>, already named right.<br>`
      + `2. Put it in your mods folder. If a folder of that name is already there, `
      + `<b>delete it first</b>. Merging leaves old portraits behind, and they can `
      + `override the new ones.<br>`
      + `3. Open MOMI, hit <b>Install</b>. Needed after every export.<br>`
      + `4. In game, build <b>${presetsNeeded()} outfit preset`
      + `${presetsNeeded() === 1 ? '' : 's'}</b> to match the slots above. A new `
      + `farmer starts with one; add the rest in the customization menu.`
      + (warnings.length
          ? `<br><br><b>Warning:</b> ${warnings.join('; ')}. Re-export from Picrew `
            + `with transparency on.`
          : '');
  } catch (err){
    st.innerHTML = `<div class="line bad">⚠ ${esc(err.message)}</div>`;
    throw err;
  }
};

/* ------------------------------------------------------ the slot table
   Emitted as GML rather than read from JSON at runtime: no file reading, no
   parsing, no path handling, and MOMI installs it like any other script. It
   lands inside the SPRITE mod, not the outfit mod, because it describes this
   export's artwork - shipping it with the sprites is what makes the two
   impossible to get out of step.

   FarmerPortraitsSync reads the global this sets. That mod ships fixed and is
   installed once; only this file changes when portraits do. */
function slotsGml(outfits){
  const rows = Object.entries(outfits)
    .map(([tag, slot]) => `    _m[$ "${tag}"] = ${slot};`).join('\n');
  return `// Farmer Portraits - which outfit preset goes with which portrait.
//
// GENERATED FILE. Rebuild it from the portrait tool rather than hand-editing,
// so this table and the sprites beside it cannot drift apart.
//
// Read by the Farmer Portraits Sync mod. Without that mod installed this is
// inert: it defines a global nothing looks at, and the portraits still work.

function __sage_fps_slot_table() {
    var _m = {};
${rows}
    return _m;
}

global.__sage_fps_table = __sage_fps_slot_table();
`;
}

const MANIFEST = JSON.stringify({
  name: 'Farmer Portraits Sprites Example',
  author: 'DeUlo',
  version: '1.0.0',
  description: 'Shows a portrait of the farmer during dialogue, varying by season, weather, day, and location.',
  minInstallerVersion: '0.13.0',
  manifestVersion: 1,
  requires_hooks: [],
}, null, 4) + '\n';

restoreState();
buildCards();
render();
</script>
