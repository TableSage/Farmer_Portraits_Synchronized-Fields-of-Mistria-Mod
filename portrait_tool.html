const PATTERNS = [
  'season_weather_cutscene','season_cutscene','weather_cutscene','cutscene',
  'season_weather_location','season_weather_inout','season_weather_day',
  'season_weather','season_location','season_inout','season_daynumber',
  'season_day','season','weather_location','weather','day','location',
  'inout','default',
];

const KINDS = [['','(nothing more)'],['day','Weekday'],['daynumber','Day of month'],
  ['location','Location'],['inout','Indoor / outdoor'],['cutscene','Cutscene']];

const VALUES = {
  day: DAYS, location: LOCATIONS, cutscene: CUTSCENES,
  inout: ['indoor','outdoor'],
  daynumber: Array.from({length:28},(_,i)=>String(i+1)),
};

const SPOILER_LOCATIONS = new Set(`abandoned_mines abandoned_pit aldaria
beach_secret caldarus_house dragonsworn_glade dungeon earth_seal fire_seal
narrows_secret priestess_quarters ruins_seal seridias_chamber seridias_house
seridias_house_back terithias_house void_seal water_seal
western_ruins`.split(/\s+/));

let spoilers = false;

function hintFor(kind, opts){
  if (!VALUES[kind] || !opts) return 'select...';
  const hidden = VALUES[kind].length - opts.length;
  if (!hidden) return 'select...';
  return opts.length ? `select... (${hidden} more with spoilers)`
                     : 'enable spoiler options to see';
}

function valuesFor(kind, keep){
  const all = VALUES[kind];
  if (!all || spoilers) return all;
  if (kind === 'cutscene') return all.filter(v => v === keep);
  if (kind === 'location')
    return all.filter(v => !SPOILER_LOCATIONS.has(v) || v === keep);
  return all;
}

const SLOTS = 8;
const TARGET_H = 180;
const MAX_H = 720;
const BLANK_W = 90;

const MOD_DIR = 'FarmerPortraitsExample';

const blankTrig = () =>
  ({isDefault:false, season:'', weather:'', kind:'', value:''});
const blank = () =>
  ({name:'', url:'', img:null, noArt:false, trigs:[blankTrig()]});
const slots = Array.from({length:SLOTS}, () => ({cards:[blank()]}));
let current = 0;

let notice = '';

const everyTrigger = () => slots.flatMap((s, slot) =>
  s.cards.flatMap((card, idx) =>
    card.trigs.map((trig, ti) => ({card, trig, slot, idx, ti}))));

const everyCard = () =>
  slots.flatMap((s, slot) => s.cards.map((card, idx) => ({card, slot, idx})));

const STORE = 'farmerPortraitsSync.v1';
let restoring = false;
let saveNote = '';

function saveState(){
  if (restoring) return;
  try {
    localStorage.setItem(STORE, JSON.stringify({v:1, current, spoilers,
      slots: slots.map(s => ({cards: s.cards.map(c => ({
        name:c.name, url:c.url, noArt:c.noArt,
        trigs: c.trigs.map(t => ({isDefault:t.isDefault, season:t.season,
          weather:t.weather, kind:t.kind, value:t.value})),
      }))}))}));
    saveNote = '';
  } catch (err){
    const full = err && (err.name === 'QuotaExceededError'
      || err.name === 'NS_ERROR_DOM_QUOTA_REACHED');
    saveNote = full
      ? 'these portraits are too large for browser storage, your work is not '
        + 'being remembered between visits. Export before you close the tab'
      : 'browser storage is unavailable, your work is not being saved';
  }
}

function restoreState(){
  let raw = null;
  try { raw = localStorage.getItem(STORE); } catch (err){ return; }
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch (err){ return; }

  if (!data || data.v !== 1 || !Array.isArray(data.slots)) return;
  restoring = true;
  const trigOf = t => Object.assign(blankTrig(), {
    isDefault: !!t.isDefault,
    season: SEASONS.includes(t.season) ? t.season : '',
    weather: WEATHER.includes(t.weather) ? t.weather : '',
    kind: KINDS.some(k => k[0] === t.kind) ? t.kind : '',
    value: String(t.value || ''),
  });
  data.slots.slice(0, SLOTS).forEach((s, i) => {
    if (!s || !Array.isArray(s.cards) || !s.cards.length) return;
    slots[i].cards = s.cards.map(c => Object.assign(blank(), {
      name: String(c.name || ''), url: typeof c.url === 'string' ? c.url : '',
      noArt: !!c.noArt,

      trigs: Array.isArray(c.trigs) && c.trigs.length
        ? c.trigs.map(trigOf) : [trigOf(c)],
    }));
  });
  if (Number.isInteger(data.current) && data.current >= 0 && data.current < SLOTS)
    current = data.current;

  spoilers = !!data.spoilers;
  $('spoilers').checked = spoilers;
  restoring = false;

  everyCard().forEach(({card}) => { if (card.url) attach(card); });
}

function shapeOf(c){
  if (c.isDefault) return (c.season || c.weather || c.kind) ? 'x' : 'default';
  const parts = [];
  if (c.season) parts.push('season');
  if (c.weather) parts.push('weather');
  if (c.kind) parts.push(c.kind);
  return parts.join('_');
}
function tagOf(c){
  if (c.isDefault) return 'default';
  return [c.season, c.weather, c.kind ? c.value : ''].filter(Boolean).join('_');
}
function statusOf(c){
  if (!c.isDefault && !c.season && !c.weather && !c.kind)
    return {state:'empty', msg:'No trigger set'};
  if (c.kind && VALUES[c.kind] && !c.value)
    return {state:'bad', msg:'Pick a value'};
  if (!PATTERNS.includes(shapeOf(c)))
    return {state:'bad', msg:'Not a valid combination'};
  return {state:'ok', tag:tagOf(c)};
}

const DIMS = {season:SEASONS.length, weather:WEATHER.length, day:DAYS.length,
  daynumber:28, location:LOCATIONS.length, inout:2, cutscene:CUTSCENES.length+1};

function regionOf(c){
  const r = {};
  if (c.isDefault) return r;
  if (c.season) r.season = c.season;
  if (c.weather) r.weather = c.weather;
  if (c.kind) r[c.kind] = c.value;
  return r;
}

const OTHER = '(any other)';

function covered(target, regions){
  const free = {};
  for (const r of regions) for (const d in r)
    if (!(d in target)) (free[d] = free[d] || new Set()).add(r[d]);
  const dims = Object.keys(free);

  const doms = dims.map(d => {
    const vals = [...free[d]];
    return vals.length < DIMS[d] ? vals.concat([OTHER]) : vals;
  });
  const total = doms.reduce((n, d) => n * d.length, 1);
  if (total > 20000) return false;
  for (let n = 0; n < total; n++){
    const ctx = Object.assign({}, target);
    let k = n;
    dims.forEach((d, i) => {
      ctx[d] = doms[i][k % doms[i].length];
      k = (k / doms[i].length) | 0;
    });
    if (!regions.some(r => Object.keys(r).every(d => r[d] === ctx[d]))) return false;
  }
  return true;
}

function shadowed(){
  const trigs = everyTrigger()
    .filter(x => statusOf(x.trig).state === 'ok')
    .map(x => Object.assign({rank: PATTERNS.indexOf(shapeOf(x.trig)),
                             region: regionOf(x.trig)}, x));
  const out = new Map();
  for (const b of trigs){
    let rivals = trigs.filter(a => a.rank < b.rank && Object.keys(b.region)
      .every(d => !(d in a.region) || a.region[d] === b.region[d]));
    if (!rivals.length || !covered(b.region, rivals.map(r => r.region))) continue;

    for (const r of rivals.slice()){
      const less = rivals.filter(x => x !== r);
      if (less.length && covered(b.region, less.map(x => x.region))) rivals = less;
    }
    out.set(b.trig, {slot: b.slot, by: rivals.map(r => tagOf(r.trig))});
  }
  return out;
}

let dead = new Map();

const overlaps = (a, b) =>
  Object.keys(a).every(d => !(d in b) || a[d] === b[d]);

const WHEN = {
  season:    v => 'in ' + v,
  weather:   v => ({sunny:'when sunny', rain:'when raining',
                    thunder:'in a thunderstorm',
                    special:'in special weather'}[v] || 'when ' + v),
  day:       v => 'on ' + v + 's',
  daynumber: v => 'on day ' + v,
  location:  v => 'at the ' + v.replace(/_/g, ' '),
  inout:     v => v === 'indoor' ? 'indoors' : 'outdoors',
  cutscene:  v => 'during ' + v.replace(/_/g, ' '),
};
const WHEN_ORDER = ['season','weather','day','daynumber','location','inout',
  'cutscene'];
function whenPhrase(rival, mine){
  const parts = WHEN_ORDER.filter(d => d in rival && !(d in mine))
    .map(d => WHEN[d](rival[d]));

  return parts.length ? parts.join(', ') : 'always';
}

const KIND_LABEL = {day:'a weekday', daynumber:'a day', location:'a location',
  inout:'indoor/outdoor', cutscene:'a cutscene'};

function coverFor(mine, rival){
  if (mine.isDefault)
    return {ok:false, why:'default is the fallback'};
  if (mine.kind && rival.kind && mine.kind !== rival.kind)
    return {ok:false, why:`No tag joins ${KIND_LABEL[mine.kind]} to `
      + `${KIND_LABEL[rival.kind]}`};
  const t = Object.assign(blankTrig(), {
    season:  mine.season  || rival.season,
    weather: mine.weather || rival.weather,
    kind:    mine.kind    || rival.kind,

    value:   mine.kind ? mine.value : rival.value,
  });
  const shape = shapeOf(t);
  if (!PATTERNS.includes(shape))
    return {ok:false, why:'no tag covers that combination'};

  if (PATTERNS.indexOf(shape) >= PATTERNS.indexOf(shapeOf(rival)))
    return {ok:false, why:'Already more specific, nothing fits between'};
  const tag = tagOf(t);
  if (everyTrigger().some(x => statusOf(x.trig).state === 'ok'
                            && tagOf(x.trig) === tag))
    return {ok:false, why:`${tag} already exists`};
  return {ok:true, tag, trig:t};
}

function conflicts(){
  const all = everyTrigger()
    .filter(x => statusOf(x.trig).state === 'ok')
    .map(x => Object.assign({rank: PATTERNS.indexOf(shapeOf(x.trig)),
                             region: regionOf(x.trig)}, x));
  const siblings = new Map();
  for (const x of all){
    if (!siblings.has(x.card)) siblings.set(x.card, []);
    siblings.get(x.card).push(x);
  }
  const out = new Map();
  for (const b of all){
    if (b.trig.isDefault) continue;
    const takers = [];
    for (const a of all){
      if (a.card === b.card || a.rank >= b.rank) continue;
      if (!overlaps(a.region, b.region)) continue;

      const zone = Object.assign({}, b.region, a.region);
      const own = siblings.get(b.card)
        .filter(o => o.rank < a.rank && overlaps(o.region, zone))
        .map(o => o.region);
      if (own.length && covered(zone, own)) continue;
      takers.push({tag: tagOf(a.trig), slot: a.slot, rank: a.rank, trig: a.trig,
                   when: whenPhrase(a.region, b.region),
                   fix: coverFor(b.trig, a.trig)});
    }
    if (takers.length)
      out.set(b.trig, takers.sort((x, y) => x.rank - y.rank));
  }
  return out;
}

function conflictsFor(card, conf = conflicts()){
  const rows = [], seen = new Map();
  for (const t of card.trigs){
    if (statusOf(t).state !== 'ok') continue;
    for (const k of conf.get(t) || []){
      let row = seen.get(k.trig);
      if (!row){
        row = {tag: k.tag, slot: k.slot, rank: k.rank, trig: k.trig, takes: []};
        seen.set(k.trig, row);
        rows.push(row);
      }
      row.takes.push({from: tagOf(t), when: k.when, fix: k.fix});
    }
  }

  return rows.sort((a, b) => a.rank - b.rank || a.tag.localeCompare(b.tag));
}

let conf = new Map();

function verdictOf(trig){
  const st = statusOf(trig);
  if (st.state !== 'ok') return st.state;
  if (dead.has(trig)) return 'never';
  return conf.has(trig) ? 'narrowed' : 'clean';
}

const VERDICT_ICON = {clean:'', narrowed:'', never:'close bad',
                      bad:'close bad', empty:''};
const VERDICT_TEXT = {clean:'', narrowed:'', never:'nes-text is-error',
                      bad:'nes-text is-error', empty:'nes-text is-disabled'};
const mark = v => VERDICT_ICON[v]
  ? `<i class="nes-icon ${VERDICT_ICON[v]} is-small"></i> ` : '';

const $ = id => document.getElementById(id);

const esc = s => String(s).replace(/[&<>]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function fill(select, opts, blankLabel){
  select.innerHTML = '';
  if (blankLabel !== null) select.append(new Option(blankLabel, ''));
  for (const o of opts){
    const [v,l] = Array.isArray(o) ? o : [o, o.replace(/_/g,' ')];
    select.append(new Option(l, v));
  }
}

const grid = $('grid');
const cells = [];
for (let i = 0; i < SLOTS; i++){
  const cell = el('div', 'cell nes-container with-title',
    `<p class="title">${i+1}</p><div class="cellbody">`
    + `<div class="tile"><span class="empty">Empty</span></div>`
    + `<div class="cap"></div></div>`);
  cell.onclick = () => select(i);
  grid.append(cell);
  cells.push(cell);
}

function select(i){
  current = i;
  buildCards();
  render();
}

function buildCards(){
  const host = $('cards');
  dead = shadowed();
  conf = conflicts();
  host.innerHTML = '';
  $('slotHead').textContent = `Slot ${current+1}`;
  slots[current].cards.forEach((card, idx) => host.append(makeCard(card, idx)));
}

function makeTrig(card, trig){
  const fields = el('div', 'fields');

  const chk = el('label', 'chk');
  const isDefault = document.createElement('input');
  isDefault.type = 'checkbox';
  isDefault.className = 'nes-checkbox';
  chk.title = 'Shown whenever nothing more specific matches. One per build.';
  chk.append(isDefault, el('span', '', 'Use as Default'));
  fields.append(chk);

  const mk = (labelText, opts, blankLabel) => {
    const r = el('div', 'nes-field');
    const lab = el('label', '', labelText);
    const sel = document.createElement('select');
    fill(sel, opts, blankLabel);

    const box = el('div', 'nes-select');
    box.append(sel);
    r.append(lab, box);
    fields.append(r);
    return sel;
  };

  const fSeason  = mk('Season', SEASONS, 'any season');
  const fWeather = mk('Weather', WEATHER, 'any weather');
  const fKind    = mk('Then One Of', KINDS, null);
  const fValue   = mk('Value', [], 'select...');

  const note = el('div');
  fields.append(note);

  function readBack(){
    trig.isDefault = isDefault.checked;
    trig.season  = fSeason.value;
    trig.weather = fWeather.value;
    trig.kind    = fKind.value;
    trig.value   = fValue.value;

    if (trig.isDefault){
      trig.season = trig.weather = trig.kind = trig.value = '';
      everyTrigger().forEach(x => {
        if (x.trig !== trig) x.trig.isDefault = false; });
    }
  }
  function paint(){
    isDefault.checked = trig.isDefault;
    fSeason.value  = trig.season;
    fWeather.value = trig.weather;

    fill(fKind, KINDS, null);
    fKind.value    = trig.kind;
    const opts = valuesFor(trig.kind, trig.value);
    fill(fValue, opts || [], hintFor(trig.kind, opts));
    fValue.value = opts ? trig.value : '';
    fSeason.disabled = fWeather.disabled = fKind.disabled = trig.isDefault;
    fValue.disabled = trig.isDefault || !opts;

    const st = statusOf(trig);
    note.className = 'trigNote' + (st.state === 'ok' ? '' : ' nes-text is-error');
    note.innerHTML = st.state === 'ok' ? '' : esc(st.msg);
  }

  [isDefault, fSeason, fWeather, fKind, fValue].forEach(c => {
    c.onchange = () => { readBack(); repaintCards(); render(); };
  });

  return {node: fields, paint,
          els: {isDefault, fSeason, fWeather, fKind, fValue, note}};
}

function makeCard(card, idx){
  const box = el('div', 'card nes-container with-title');
  box.append(el('p', 'title', `Portrait ${idx+1}`));
  const detail = el('div', 'detail');

  const art     = el('div', 'art nes-container with-title');
  const preview = el('div', 'preview nes-container');
  const filename = el('div', 'filename');
  const tagcol  = el('div', 'tagcol nes-container with-title');
  const ctlcol  = el('div', 'ctlcol nes-container with-title');
  const panel   = el('div', 'tree nes-container with-title');
  const noArtChk = el('label', 'chk noart');
  const noArt = document.createElement('input');
  noArt.type = 'checkbox';
  noArt.className = 'nes-checkbox';
  noArtChk.title = 'Switch the outfit for these tags, but draw nothing in the '
    + 'dialogue box. Needs no picture.';
  noArtChk.append(noArt, el('span', '', 'Do Not Use Portrait'));
  noArt.onchange = () => {
    card.noArt = noArt.checked;
    repaintCards();
    render();
  };
  art.append(el('p', 'title', 'Picture'), preview, filename, noArtChk);
  detail.append(art, tagcol, ctlcol, panel);

  if (card._sel === undefined || card._sel >= card.trigs.length) card._sel = 0;
  const trig = card.trigs[card._sel];

  tagcol.append(el('p', 'title', 'Tags'));
  const taglist = el('table', 'taglist nes-table');
  const tbody = document.createElement('tbody');
  taglist.append(tbody);

  const tagPicks = [], tagXs = [], tagRows = [], arrows = [];
  card.trigs.forEach((t, ti) => {
    const row = el('tr', 'tagrow');
    tagRows.push(row);

    const ar = el('td', 'arrow');
    arrows.push(ar);
    const b = el('button', 'tagpick');
    b.onclick = () => { card._sel = ti; buildCards(); render(); };
    const tg = el('td', 'tg');
    tg.append(b);
    row.append(ar, tg);
    tagPicks.push(b);
    if (card.trigs.length > 1){
      const x = el('button', 'tagx nes-btn is-error',
                   '<i class="nes-icon close is-small"></i>');
      x.title = 'Remove this tag. The picture and its other tags stay.';
      x.onclick = () => {
        card.trigs.splice(ti, 1);
        if (card._sel >= card.trigs.length) card._sel = card.trigs.length - 1;
        buildCards(); render();
      };
      const xd = el('td', 'tx');
      xd.append(x);
      row.append(xd);
      tagXs.push(x);
    } else tagXs.push(null);
    tbody.append(row);
  });
  tagcol.append(taglist);

  const addTag = el('button', 'addTag nes-btn', '+ Add a Tag');
  addTag.title = 'Another tag for this same picture. Use it when a '
    + 'higher-priority tag is taking contexts away from this one.';
  addTag.onclick = () => {
    card.trigs.push(blankTrig());
    card._sel = card.trigs.length - 1;
    buildCards(); render();
  };
  tagcol.append(addTag);

  ctlcol.append(el('p', 'title', 'This Tag'));
  const row = makeTrig(card, trig);
  ctlcol.append(row.node);

  let delCard = null;
  if (slots[current].cards.length > 1){
    delCard = el('button', 'delCard nes-btn is-error', 'Remove Portrait');
    delCard.title = 'Removes this portrait and every tag on it';
    delCard.onclick = e => { e.stopPropagation(); removeCard(idx); };
    art.append(delCard);
  }
  box.append(detail);

  function applyCover(fix){
    card.trigs.push(fix.trig);
    card._sel = card.trigs.length - 1;
    buildCards();
    render();
  }

  function paintPanel(){
    panel.innerHTML = '';
    panel.append(el('p', 'title', 'Conflicts'));
    if (!card.trigs.some(t => statusOf(t).state === 'ok')){
      panel.append(el('div', 'treeNote nes-text is-disabled',
                      'Finish the tag first.'));
      return;
    }

    const rows = conflictsFor(card, conf);
    const gone = card.trigs.filter(t => dead.has(t));
    const onlyDefault = card.trigs.every(t => t.isDefault || statusOf(t).state !== 'ok');
    const sum = el('div', 'treeSum' + (gone.length ? ' nes-text is-error' : ''));
    if (onlyDefault && !gone.length){
      sum.innerHTML = mark('clean')
        + 'Fallback. Shows when no other tag matches.';
      panel.append(sum);
      return;
    }
    if (gone.length)
      sum.innerHTML = mark('never')
        + `<code class="tag">${gone.map(tagOf).join('</code>, <code class="tag">')}`
        + `</code> never shows. `
        + `Other tags cover every context.`;
    else if (rows.length)
      sum.innerHTML = mark('narrowed') + `${rows.length} tag`
        + `${rows.length > 1 ? 's win' : ' wins'} before this portrait.`;
    else
      sum.innerHTML = mark('clean') + 'No conflicts.';
    panel.append(sum);

    const ul = el('ul', 'ladder nes-list');
    for (const r of rows){
      const li = el('li', 'up');
      const head = el('div', 'rung');
      const takes = el('ul', 'takes nes-list');

      head.append(el('code', 'tag', esc(r.tag)));
      li.append(head);
      for (const t of r.takes){
        const line = el('li', 'take');

        line.append(el('span', '',
          `Wins ${esc(t.when)}. You lose <code class="tag">${esc(t.from)}</code>`));
        if (t.fix.ok){
          const b = el('button', 'cover nes-btn is-warning',
                       '<span>+</span><span>' + esc(t.fix.tag) + '</span>');
          b.title = `Add ${t.fix.tag} to this portrait. It outranks `
            + `${r.tag}, so this art wins that context back.`;
          b.onclick = () => applyCover(t.fix);
          line.append(b);
        } else {
          line.append(el('span', 'no nes-text is-disabled', esc(t.fix.why)));
        }
        takes.append(line);
      }
      li.append(takes);
      ul.append(li);
    }
    panel.append(ul);
  }

  function paint(){
    noArt.checked = card.noArt;
    preview.className = 'preview nes-container' + (card.noArt ? ' none' : '');
    preview.innerHTML = card.noArt
      ? '<div class="lbl nes-text is-disabled">Slot Left Blank</div>'
      : card.url ? `<img src="${card.url}" alt="">`
      : '<div class="arrow">&#11014;</div><div class="lbl">Upload</div>';
    filename.className = 'filename nes-text is-disabled';
    filename.textContent = card.noArt ? '' : card.name;
    card.trigs.forEach((t, ti) => {
      const v = verdictOf(t);
      const b = tagPicks[ti];
      const on = ti === card._sel;

      b.className = `tagpick ${v}` + (on ? ' sel' : '');
      arrows[ti].textContent = on ? '>' : '';
      tagRows[ti].className = 'tagrow' + (on ? ' sel' : '');
      const st = statusOf(t);
      const label = st.state === 'ok' ? st.tag : st.msg;
      b.title = label;
      b.innerHTML = `<span class="txt${st.state === 'ok' ? ' tag' : ''}">`
        + `${esc(label)}</span>`;
    });
    row.paint();
    paintPanel();
  }

  preview.onclick = () => {
    if (card.noArt) return;
    pickTarget = card;
    $('picker').click();
  };

  card._paint = paint;

  card._trigs = [row.els];
  card._els = Object.assign({preview, filename, panel, addTag, delCard, noArt,
                             tagPicks, tagXs, tagRows}, row.els);
  paint();
  return box;
}

const repaintCards = () => {
  dead = shadowed();
  conf = conflicts();
  slots[current].cards.forEach(c => c._paint && c._paint());
};

$('addCard').onclick = () => {
  slots[current].cards.push(blank());
  buildCards();
  render();
};
function removeCard(idx){
  if (slots[current].cards.length < 2) return;
  slots[current].cards.splice(idx, 1);
  buildCards();
  render();
}

$('flip').onchange = () =>
  $('wrap').classList.toggle('flipped', $('flip').checked);

$('spoilers').onchange = () => {
  spoilers = $('spoilers').checked;
  repaintCards();
  render();
};

$('reset').onclick = () => {
  if (!confirm('Throw away every portrait and trigger, and start from empty?')) return;
  try { localStorage.removeItem(STORE); } catch (err){}
  slots.forEach(s => { s.cards = [blank()]; });
  current = 0;
  notice = '';
  buildCards();
  render();
};

function render(){
  saveState();

  dead = shadowed();
  conf = conflicts();
  slots.forEach((s, i) => {
    const cell = cells[i];
    cell.classList.toggle('is-dark', i === current);
    const shown = s.cards.find(c => c.url && !c.noArt);
    const tile = cell.querySelector('.tile');

    const isBlank = s.cards.some(c => c.noArt);
    const art = shown ? `<img src="${shown.url}" alt="">`
      : `<span class="empty${isBlank ? ' blank' : ''} nes-text is-disabled">`
        + `${isBlank ? 'Slot Left Blank' : 'Empty'}</span>`;
    const body = (s.cards.length > 1
          ? `<span class="count nes-text is-primary">${s.cards.length}x</span>` : '')
      + art;

    if (tile.innerHTML !== body) tile.innerHTML = body;

    cell.querySelector('.cap').innerHTML = s.cards.flatMap(c => c.trigs).map(t => {
      const st = statusOf(t), v = verdictOf(t);
      const body = st.state === 'ok'
        ? `<span class="tag">${st.tag}</span>` : st.msg;
      return `<b class="${v} ${VERDICT_TEXT[v]}">`
        + `${mark(v)}${body}</b>`;
    }).join('');
  });

  const problems = validate(dead);

  const warn = m => `<div class="line warn">${mark('narrowed')}${m}</div>`;
  const lines = [
    ...[notice, saveNote].filter(Boolean).map(warn),
    ...problems.map(m => `<div class="line bad nes-text is-error">`
      + `${mark('never')}${m}</div>`),
    ...advisories(dead).map(warn),
  ];
  if (!problems.length){
    const p = everyCard().length, t = everyTrigger().length;
    lines.push(`<div class="line ok">${mark('clean')}${p} portraits ready`
      + (t !== p ? `, ${t} tags` : '') + `</div>`);
  }
  $('status').innerHTML = lines.join('');

  const blocked = problems.length > 0;
  $('export').disabled = blocked;
  $('export').classList.toggle('is-disabled', blocked);
  $('export').classList.toggle('is-success', !blocked);
}

function presetsNeeded(){
  const used = everyTrigger()
    .filter(x => statusOf(x.trig).state === 'ok').map(x => x.slot);
  return used.length ? Math.max(...used) + 1 : 1;
}

function advisories(d = shadowed()){
  const out = [];
  const used = new Set(everyTrigger()
    .filter(x => statusOf(x.trig).state === 'ok').map(x => x.slot));

  if (!used.size) return out;
  const need = presetsNeeded();
  const gaps = [];
  for (let i = 0; i < need; i++) if (!used.has(i)) gaps.push(i + 1);
  if (gaps.length) out.push(`Slot ${gaps.join(', ')} unused, but slot ${need} is. `
    + `You still have to build ${need} outfit presets in game`);
  return out;
}

function validate(d = shadowed()){
  const out = [];

  const cards = everyCard().filter(x => !x.card.noArt), all = everyTrigger();
  const noImage = cards.filter(x => !x.card.url).length;
  if (noImage) out.push(`${noImage} portrait(s) need an image`);

  const loading = cards.filter(x => x.card.url && !x.card.img).length;
  if (loading) out.push(`${loading} portrait(s) still loading`);
  const bad = all.filter(x => statusOf(x.trig).state !== 'ok').length;
  if (bad) out.push(`${bad} tag(s) unfinished`);
  const defs = all.filter(x => x.trig.isDefault).length;
  if (defs !== 1) out.push(defs === 0
    ? 'No default tag (one is required)'
    : `${defs} default tags (only one allowed)`);

  const tags = all.filter(x => statusOf(x.trig).state === 'ok').map(x => tagOf(x.trig));
  const dupes = [...new Set(tags.filter((t,i) => tags.indexOf(t) !== i))];
  if (dupes.length) out.push('Duplicate tags: ' + dupes.join(', '));
  for (const [trig, x] of d)
    out.push(`"${tagOf(trig)}" (slot ${x.slot+1}) never shows. `
      + `${x.by.join(', ')} ${x.by.length > 1 ? 'cover' : 'covers'} it`);
  return out;
}

function attach(card){
  const im = new Image();
  im.onload = () => { card.img = im; repaintCards(); render(); };
  im.onerror = () => {
    Object.assign(card, {url:'', img:null});
    repaintCards(); render();
  };
  im.src = card.url;
}

function loadInto(card, file){
  const src = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(src);
    let nat;
    try { nat = toNative(im); }
    catch (err){ notice = `${esc(file.name)}: ${err.message}`; repaintCards(); render(); return; }
    if (nat.fitted)
      notice = `${esc(file.name)} was ${im.naturalWidth || im.width}x`
        + `${im.naturalHeight || im.height}, resized to ${nat.w}x${nat.h}, the `
        + `largest the game reads without losing detail`;
    card.name = file.name;
    card.url = nat.canvas.toDataURL('image/png');
    card.noArt = false;
    attach(card);
  };

  im.onerror = () => {
    URL.revokeObjectURL(src);
    notice = `${esc(file.name)} is not a readable PNG`;
    repaintCards(); render();
  };
  im.src = src;
}

function acceptInto(slot, files){
  const s = slots[slot];
  files.forEach((f, n) => {
    if (n === 0) loadInto(s.cards[0], f);
    else { const c = blank(); s.cards.push(c); loadInto(c, f); }
  });
  if (files.length > 1 && slot === current) buildCards();
}
function acceptFiles(files, slot){
  const list = [...files].filter(f => /\.png$/i.test(f.name));
  const rejected = files.length - list.length;
  notice = rejected ? `${rejected} file(s) ignored, PNG only` : '';
  if (!list.length){ render(); return; }
  if (slot !== undefined){ acceptInto(slot, list); return; }

  let n = 0;
  for (let i = 0; i < SLOTS && n < list.length; i++)
    if (!slots[i].cards[0].url && !slots[i].cards[0].noArt)
      loadInto(slots[i].cards[0], list[n++]);
}

let pickTarget = null;
$('picker').onchange = e => {
  const f = [...e.target.files].filter(x => /\.png$/i.test(x.name));
  notice = e.target.files.length - f.length
    ? `${e.target.files.length - f.length} file(s) ignored, PNG only` : '';
  if (f.length && pickTarget) loadInto(pickTarget, f[0]);
  e.target.value = '';
  render();
};

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
cells.forEach((cell, i) => {
  cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drop'); });
  cell.addEventListener('dragleave', () => cell.classList.remove('drop'));
  cell.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    cell.classList.remove('drop');
    select(i);
    acceptFiles(e.dataTransfer.files, i);
    render();
  });
});
grid.addEventListener('drop', e => {
  e.preventDefault(); acceptFiles(e.dataTransfer.files); render();
});

function imageDataOf(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.getContext('2d').getImageData(0, 0, c.width, c.height);
}

function nativeScale(d){
  const {width:w, height:h, data:p} = d;
  let best = 1;
  outer:
  for (let n = 2; n <= 16; n++){
    if (w % n || h % n) continue;
    for (let y = 0; y < h; y++){
      const by = y - (y % n);
      for (let x = 0; x < w; x++){
        const i = (y*w + x)*4, j = (by*w + (x - x%n))*4;
        if (p[i]!==p[j] || p[i+1]!==p[j+1] || p[i+2]!==p[j+2] || p[i+3]!==p[j+3])
          continue outer;
      }
    }
    best = n;
  }
  return best;
}

function scaleTo(src, w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  return c;
}

function fitToFrame(img, sw, sh){
  const widthAt = h => Math.max(1, Math.round(sw * h / sh));
  let src = img, h = sh;
  while (h > MAX_H * 2){
    h = Math.round(h / 2);
    src = scaleTo(src, widthAt(h), h);
  }
  const c = scaleTo(src, widthAt(MAX_H), MAX_H);
  return {canvas:c, data:c.getContext('2d').getImageData(0, 0, c.width, c.height),
          w:c.width, h:MAX_H, scale:1, fitted:true};
}

function toNative(img){
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (h > MAX_H * 16) return fitToFrame(img, w, h);
  const d = imageDataOf(img);
  const n = nativeScale(d);
  const nw = d.width / n, nh = d.height / n;
  if (nh > MAX_H) return fitToFrame(img, w, h);
  const c = document.createElement('canvas');
  c.width = nw; c.height = nh;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(nw, nh);
  for (let y = 0; y < nh; y++){
    for (let x = 0; x < nw; x++){
      const si = ((y*n)*d.width + x*n) * 4, di = (y*nw + x) * 4;
      out.data[di]   = d.data[si];
      out.data[di+1] = d.data[si+1];
      out.data[di+2] = d.data[si+2];
      out.data[di+3] = d.data[si+3];
    }
  }
  ctx.putImageData(out, 0, 0);
  return {canvas:c, data:out, w:nw, h:nh, scale:n};
}

function finish(d){
  const nw = d.width, nh = d.height;
  if (nh > MAX_H)
    throw new Error(`image is ${nh}px tall, taller than ${MAX_H}`);
  const fh = Math.max(nh, TARGET_H);
  let opaque = true;
  const c = document.createElement('canvas');
  c.width = nw; c.height = fh;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(nw, fh);
  const pad = fh - nh;
  for (let y = 0; y < nh; y++){
    for (let x = 0; x < nw; x++){
      const si = (y*nw + (nw-1-x)) * 4;
      const di = ((y+pad)*nw + x) * 4;
      out.data[di]   = d.data[si];
      out.data[di+1] = d.data[si+1];
      out.data[di+2] = d.data[si+2];
      out.data[di+3] = d.data[si+3];
      if (d.data[si+3] === 0) opaque = false;
    }
  }
  ctx.putImageData(out, 0, 0);
  return {canvas:c, w:nw, h:fh, opaque};
}

function processImage(img){
  const n = toNative(img);
  return Object.assign(finish(n.data), {scale:n.scale});
}

function blankArt(){
  return finish({width:BLANK_W, height:TARGET_H,
                 data:new Uint8ClampedArray(BLANK_W * TARGET_H * 4)});
}

const TOML = (w,h) => `[meta_properties]
asset_kind = "Animation"

[asset_properties]
frame_size = [${w}, ${h}]
frame_len = 1
atlas = "Npc"
`;

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new Uint8Array(30 + name.length);
    const v = new DataView(lh.buffer);
    v.setUint32(0, 0x04034b50, true);
    v.setUint16(4, 20, true);
    v.setUint16(8, 0, true);
    v.setUint16(10, 0, true);
    v.setUint16(12, 0x21, true);
    v.setUint32(14, crc, true);
    v.setUint32(18, size, true);
    v.setUint32(22, size, true);
    v.setUint16(26, name.length, true);
    lh.set(name, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + name.length);
    const w = new DataView(ch.buffer);
    w.setUint32(0, 0x02014b50, true);
    w.setUint16(4, 20, true);
    w.setUint16(6, 20, true);
    w.setUint16(10, 0, true);
    w.setUint16(12, 0, true);
    w.setUint16(14, 0x21, true);
    w.setUint32(16, crc, true);
    w.setUint32(20, size, true);
    w.setUint32(24, size, true);
    w.setUint16(28, name.length, true);
    w.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  const cdSize = central.reduce((a,c) => a + c.length, 0);
  const eocd = new Uint8Array(22);
  const e = new DataView(eocd.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eocd], {type:'application/zip'});
}

const canvasBytes = canvas => new Promise(res =>
  canvas.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), 'image/png'));

async function buildFiles(){
  const enc = new TextEncoder();
  const dir = `${MOD_DIR}/animations/FarmerPortraits/`;
  const files = [], outfits = {}, warnings = [];

  for (const {card, trig, slot} of everyTrigger()){
    const tag = tagOf(trig);

    const r = card.noArt ? blankArt() : finish(imageDataOf(card.img));
    if (r.opaque) warnings.push(`${tag} has no transparency`);
    files.push({name: `${dir}spr_farmer_portrait_${tag}.png`,
                data: await canvasBytes(r.canvas)});
    files.push({name: `${dir}spr_farmer_portrait_${tag}.meta.toml`,
                data: enc.encode(TOML(r.w, r.h))});

    outfits[tag] = slot;
  }

  files.push({name: `${MOD_DIR}/outfit_slots.json`, data: enc.encode(JSON.stringify({
    _comment: '0-based preset index, as passed to obj_ari.change_preset(n)',
    slots: outfits,
  }, null, 2) + '\n')});
  files.push({name: `${MOD_DIR}/manifest.json`, data: enc.encode(MANIFEST)});

  files.push({name: `${MOD_DIR}/gml/FarmerPortraitsSlots.gml`,
              data: enc.encode(slotsGml(outfits))});
  return {files, warnings};
}

$('export').onclick = async () => {
  if (validate().length) return;
  const st = $('status');
  st.innerHTML = '<div class="line">Building...</div>';
  try {
    const {files, warnings} = await buildFiles();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(makeZip(files));
    a.download = `${MOD_DIR}.zip`;
    a.click();

    st.innerHTML = `<div class="line ok">${mark('clean')}`
      + `Exported ${files.length} files</div>`;
    const after = $('afterExport');
    after.style.display = '';
    after.innerHTML =
      `<b>Next steps</b><br>`
      + `1. Unzip. You get one folder, <b>${MOD_DIR}</b>, already named right.<br>`
      + `2. Put it in your mods folder. If a folder of that name is already there, `
      + `<b>delete it first</b>. Merging leaves old portraits behind, and they can `
      + `override the new ones.<br>`
      + `3. Open MOMI, hit <b>Install</b>. Needed after every export.<br>`
      + `4. In game, build <b>${presetsNeeded()} outfit preset`
      + `${presetsNeeded() === 1 ? '' : 's'}</b> to match the slots above. A new `
      + `farmer starts with one; add the rest in the customization menu.`
      + (warnings.length
          ? `<br><br><b>Warning:</b> ${warnings.join('; ')}. Save the PNG with a `
            + `transparent background, or the portrait shows up as a rectangle.`
          : '');
  } catch (err){
    st.innerHTML = `<div class="line bad nes-text is-error">${mark('never')}`
      + `${esc(err.message)}</div>`;
    throw err;
  }
};

function slotsGml(outfits){
  const rows = Object.entries(outfits)
    .map(([tag, slot]) => `    _m[$ "${tag}"] = ${slot};`).join('\n');
  return `// Farmer Portraits - which outfit preset goes with which portrait.
//
// GENERATED FILE. Rebuild it from the portrait tool rather than hand-editing,
// so this table and the sprites beside it cannot drift apart.
//
// Read by the Farmer Outfits and Portraits - Synchronized mod. Without that mod
// installed this is inert: it defines a global nothing looks at, and the
// portraits still work.

function __sage_fps_slot_table() {
    var _m = {};
${rows}
    return _m;
}

global.__sage_fps_table = __sage_fps_slot_table();
`;
}

const MANIFEST = JSON.stringify({
  name: 'Farmer Portraits Sprites Example',
  author: 'DeUlo',
  version: '1.0.0',
  description: 'Shows a portrait of the farmer during dialogue, varying by season, weather, day, and location.',
  minInstallerVersion: '0.13.0',
  manifestVersion: 1,
  requires_hooks: [],
}, null, 4) + '\n';

restoreState();
buildCards();
render();
</script>
